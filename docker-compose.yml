services:
  postgres:
    image: postgres:16-alpine
    container_name: onyargi-avcisi-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-onyargi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-onyargi_dev_pass}
      POSTGRES_DB: ${POSTGRES_DB:-onyargi_avcisi}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-onyargi} -d ${POSTGRES_DB:-onyargi_avcisi}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
